openapi: 3.1.0
info:
  title: Apostille Me API
  version: 0.1.0
  description: "Track sanitized client references, document workflows, destination jurisdictions, appointments, deadlines, and case events for a visa and apostille consulting firm."
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: service is alive
  /api/v1/cases:
    get:
      operationId: listCases
      responses:
        '200':
          description: bounded list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
    post:
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCase'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '422':
          description: validation failure
  /api/v1/cases/{id}:
    get:
      operationId: getCase
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404': { description: not found }
  /ws:
    get:
      operationId: websocket
      responses:
        '101': { description: WebSocket upgrade }
components:
  schemas:
    Case:
      $ref: './schemas/case.json'
    CreateCase:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        summary: { type: string, maxLength: 4000 }
