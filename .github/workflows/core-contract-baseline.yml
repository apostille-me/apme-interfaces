name: Core contract baseline

on:
  pull_request:
    paths:
      - "typespec/**"
      - "json-schema/**"
      - "schema-authority-canary/**"
      - "contract-admission/**"
      - ".github/workflows/core-contract-baseline.yml"
  push:
    branches: [main]
    paths:
      - "typespec/**"
      - "json-schema/**"
      - "schema-authority-canary/**"
      - "contract-admission/**"
      - ".github/workflows/core-contract-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract-baseline:
    # TypeSpec + authored JSON Schema remain peer authorities. Protobuf, WIT,
    # and Dafny are additive verification/projection lanes, not new authorities.
    uses: ORESoftware/typespec-json-schema-validator/.github/workflows/core-contract-baseline-reusable.yml@30460506b81570df89c10744ede007ab9ead7e81
